name: Build RT-AC88U 386

on:
  workflow_dispatch:
  push:
    branches:
      - 386-community-lts
    paths:
      - ".github/workflows/build-rt-ac88u.yml"
      - "tools/build-rt-ac88u-ci.sh"
      - "release/**"

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    timeout-minutes: 360

    steps:
      - name: Bootstrap container packages
        run: |
          dpkg --add-architecture i386
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            autopoint \
            autogen \
            bc \
            bison \
            bzip2 \
            build-essential \
            ca-certificates \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            dos2unix \
            file \
            flex \
            gawk \
            gengetopt \
            gettext \
            git \
            gperf \
            intltool \
            kmod \
            libc6-i386 \
            libc6-dev-i386 \
            lib32stdc++6 \
            lib32z1 \
            libelf1:i386 \
            libglib2.0-dev \
            liblzo2-dev \
            libncurses5-dev \
            libtool \
            libtool-bin \
            libuuid1 \
            m4 \
            patch \
            pkg-config \
            python2 \
            rsync \
            shtool \
            texinfo \
            u-boot-tools \
            uuid-dev \
            wget \
            xsltproc \
            zlib1g-dev

      - name: Check out firmware sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out official Merlin toolchains
        uses: actions/checkout@v4
        with:
          repository: RMerl/am-toolchains
          path: am-toolchains
          fetch-depth: 1

      - name: Install Broadcom toolchain host libs
        env:
          AM_TOOLCHAINS_ROOT: ${{ github.workspace }}/am-toolchains
        run: |
          set -eux
          TC_ROOT="$AM_TOOLCHAINS_ROOT/brcm-arm-sdk/hndtools-arm-linux-2.6.36-uclibc-4.5.3"
          TC_LIB="$TC_ROOT/lib"
          DEST=/usr/lib/i386-linux-gnu
          mkdir -p "$DEST"
          for so in libmpc.so.2 libmpfr.so.4 libgmp.so.10 libgmpxx.so.4; do
            src="$(readlink -f "$TC_LIB/$so" 2>/dev/null || true)"
            if [[ -z "$src" || ! -e "$src" ]]; then
              src="$(ls -1 "$TC_LIB"/${so}* 2>/dev/null | head -n1 || true)"
            fi
            if [[ -n "$src" && -e "$src" ]]; then
              cp -a "$src" "$DEST/"
              base="$(basename "$src")"
              ln -sfn "$base" "$DEST/$so"
              echo "Installed $so -> $DEST/$base"
            else
              echo "WARNING: missing $so under $TC_LIB" >&2
            fi
          done
          # Hide broken host tools shipped inside the Broadcom bin dir.
          for t in autoconf autoheader autom4te automake autoreconf aclocal libtool libtoolize; do
            if [[ -e "$TC_ROOT/bin/$t" ]]; then
              mv "$TC_ROOT/bin/$t" "$TC_ROOT/bin/$t.sdk-disabled"
            fi
          done
          echo "$DEST" > /etc/ld.so.conf.d/brcm-arm-sdk-i386.conf
          echo "$TC_LIB" >> /etc/ld.so.conf.d/brcm-arm-sdk-i386.conf
          ldconfig
          export LD_LIBRARY_PATH="$TC_LIB:$DEST${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          test -d "${{ github.workspace }}/.git"
          git -C "${{ github.workspace }}" rev-parse --short HEAD
          file "$TC_ROOT/bin/arm-brcm-linux-uclibcgnueabi-gcc"
          ldd "$TC_ROOT/libexec/gcc/arm-brcm-linux-uclibcgnueabi/4.5.3/cc1"
          "$TC_ROOT/bin/arm-brcm-linux-uclibcgnueabi-gcc" --version
          which autoreconf autoconf automake
          autoreconf --version | head -n1
          echo 'int main(void){return 0;}' > /tmp/t.c
          "$TC_ROOT/bin/arm-brcm-linux-uclibcgnueabi-gcc" -c /tmp/t.c -o /tmp/t.o
          ls -la /tmp/t.o
          df -h

      - name: Build firmware
        env:
          AM_TOOLCHAINS_ROOT: ${{ github.workspace }}/am-toolchains
          LD_LIBRARY_PATH: ${{ github.workspace }}/am-toolchains/brcm-arm-sdk/hndtools-arm-linux-2.6.36-uclibc-4.5.3/lib:/usr/lib/i386-linux-gnu
        run: bash tools/build-rt-ac88u-ci.sh

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rt-ac88u-386-community
          path: release/src-rt-7.14.114.x/src/image/*.trx
          if-no-files-found: error
          retention-days: 14