name: Build RT-AC88U 386

on:
  workflow_dispatch:
  push:
    branches:
      - 386-community-lts
    paths:
      - ".github/workflows/build-rt-ac88u.yml"
      - "tools/build-rt-ac88u-ci.sh"
      - "release/**"

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    timeout-minutes: 360

    steps:
      - name: Check out firmware sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out official Merlin toolchains
        uses: actions/checkout@v4
        with:
          repository: RMerl/am-toolchains
          path: am-toolchains
          fetch-depth: 1

      - name: Install legacy host dependencies
        run: |
          dpkg --add-architecture i386
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            autopoint \
            autogen \
            bc \
            bison \
            bzip2 \
            build-essential \
            cmake \
            cpio \
            device-tree-compiler \
            dos2unix \
            file \
            flex \
            gawk \
            gengetopt \
            gettext \
            git \
            gperf \
            intltool \
            kmod \
            libc6-i386 \
            libc6-dev-i386 \
            lib32stdc++6 \
            lib32z1 \
            libelf1:i386 \
            libglib2.0-dev \
            libgmp-dev \
            libgmp3-dev \
            liblzo2-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libtool \
            libtool-bin \
            libuuid1 \
            m4 \
            patch \
            pkg-config \
            python2 \
            rsync \
            shtool \
            texinfo \
            u-boot-tools \
            uuid-dev \
            wget \
            xsltproc \
            zlib1g-dev
          # Broadcom GCC 4.5.3 is linked against libmpc.so.2; Ubuntu 20.04 ships .so.3
          MPC_SO3="$(ldconfig -p | awk '/libmpc\.so\.3/ {print $NF; exit}')"
          if [[ -n "$MPC_SO3" && ! -e /usr/lib/x86_64-linux-gnu/libmpc.so.2 ]]; then
            ln -sf "$MPC_SO3" /usr/lib/x86_64-linux-gnu/libmpc.so.2
          fi
          ldconfig

      - name: Verify toolchain and available space
        run: |
          df -h
          file am-toolchains/brcm-arm-sdk/hndtools-arm-linux-2.6.36-uclibc-4.5.3/bin/arm-brcm-linux-uclibcgnueabi-gcc
          ldd am-toolchains/brcm-arm-sdk/hndtools-arm-linux-2.6.36-uclibc-4.5.3/bin/../libexec/gcc/arm-brcm-linux-uclibcgnueabi/4.5.3/cc1 || true
          am-toolchains/brcm-arm-sdk/hndtools-arm-linux-2.6.36-uclibc-4.5.3/bin/arm-brcm-linux-uclibcgnueabi-gcc --version

      - name: Build firmware
        env:
          AM_TOOLCHAINS_ROOT: ${{ github.workspace }}/am-toolchains
        run: bash tools/build-rt-ac88u-ci.sh

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rt-ac88u-386-community
          path: release/src-rt-7.14.114.x/src/image/*.trx
          if-no-files-found: error
          retention-days: 14